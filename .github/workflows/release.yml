name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # goreleaser creates the GitHub Release and uploads assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: qooq-cli
          # goreleaser builds the changelog from commits since the previous
          # tag, which it cannot see in a shallow clone.
          fetch-depth: 0

      # go.mod points at github.com/qooqapp/qooq through a `replace` to a
      # sibling directory, so the CLI cannot be built without it.
      #
      # ref is spelled out rather than left to the default branch: a v* tag is
      # the standalone line, so it pairs with qooq's main. Leaving it implicit
      # worked only because main happens to be the default, which is a fact
      # about repository settings rather than about these two lines.
      - uses: actions/checkout@v5
        with:
          repository: qooqapp/qooq
          path: qooq
          ref: main

      # Tags are not branch-scoped, so `git tag v1.2.3` on a side-branch commit
      # arrives here exactly like one on main, and goreleaser would publish an
      # archive of unreviewed code under a release version.
      #
      # The check is whether the tagged commit is reachable from main -- not a
      # guess from the tag's name, which the tagger chooses.
      - name: the tag has to be on main
        working-directory: qooq-cli
        run: |
          git fetch --no-tags --depth=1 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main."
            echo "v* tags release the product and must be cut from main."
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: qooq-cli/go.mod
          cache: true

      - run: make check
        working-directory: qooq-cli

      - uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned, not "~> v2": the config uses archive field names
          # (builds/format) that later v2 releases renamed, so floating the
          # version would break a release at the worst possible moment. This is
          # the version the config was validated against.
          version: "v2.5.1"
          args: release --clean
          workdir: qooq-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Announce the release in Discord. The webhook URL is a credential —
      # anyone holding it can post to the channel — so it lives in a repository
      # secret rather than in this file, which would put it in git history for
      # good. An unset secret skips the step instead of failing: a notification
      # is not worth failing an otherwise good release over.
      - name: announce on Discord
        # The release is already published by this point. A Discord outage must
        # show up as a red step, not as a red release that looks like it failed.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK is not set, skipping the announcement"
            exit 0
          fi

          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Read the asset names back off the release rather than writing them
          # out here, so the message cannot drift from what was really published
          # — a list that says four platforms when three were uploaded is worse
          # than no list.
          assets=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[].name] | join("\n")')

          # VERSION is deliberately left out of the install hint: install.sh
          # applies it to both repositories, so pinning it only works while the
          # two carry the same tag. Omitted, each resolves its own latest.
          read -r -d '' install <<'INSTALL' || true
          curl -fsSL https://raw.githubusercontent.com/qooqapp/qooq/main/install.sh | sh
          INSTALL

          payload=$(jq -n \
            --arg title "$GITHUB_REPOSITORY $TAG" \
            --arg url "$release_url" \
            --arg commit "${GITHUB_SHA:0:7}" \
            --arg run "$run_url" \
            --arg assets "$assets" \
            --arg install "$install" \
            '{
              username: "qooq release",
              embeds: [{
                title: $title,
                url: $url,
                color: 3055683,
                description: "新版本已發佈。點標題看 changelog 與下載。",
                fields: [
                  { name: "commit", value: ("`" + $commit + "`"), inline: true },
                  { name: "build",  value: ("[workflow run](" + $run + ")"), inline: true },
                  { name: "安裝",   value: ("```sh\n" + $install + "```") },
                  { name: "檔案",   value: ("```\n" + $assets + "\n```") }
                ],
                timestamp: (now | todate)
              }]
            }')

          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$DISCORD_WEBHOOK" > /dev/null
          echo "announced $TAG"
